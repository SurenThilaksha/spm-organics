trust:
  - icon: leaf
    label: 100% natural
  - icon: shield
    label: No additives or fillers
  - icon: sun
    label: Shade-dried, small batch
  - icon: globe
    label: Ships worldwide

benefits:
  - icon: sparkle
    title: Rich in natural antioxidants
    text: Curry leaves are naturally rich in plant compounds valued in traditional Sri Lankan and Ayurvedic cooking.
  - icon: heart
    title: A daily green boost
    text: A spoonful adds the goodness of fresh leaves to rice, curries, soups and smoothies — all year round.
  - icon: mortar
    title: Authentic Sri Lankan flavour
    text: That warm, citrusy, nutty aroma that makes home cooking taste like home.
  - icon: package
    title: Convenient & long-lasting
    text: No more wilting leaves in the fridge. Stays fresh for months in its resealable pouch.

process:
  - title: Hand-picked
    text: Young, healthy leaves picked by hand from trees grown without chemical sprays.
  - title: Washed & sorted
    text: Rinsed in clean water and sorted leaf by leaf — stems and damaged leaves removed.
  - title: Shade-dried
    text: Dried slowly away from direct sun to keep the deep green colour and natural oils.
  - title: Stone-ground
    text: Ground in small batches into a fine powder, then sieved for a smooth texture.
  - title: Sealed fresh
    text: Packed straight away in food-grade resealable pouches to lock in aroma.

uses:
  - title: Curries & dhal
    text: Stir 1 tsp into the tempering or near the end of cooking.
  - title: Rice & kiribath
    text: Sprinkle over hot rice with a little ghee or coconut oil.
  - title: Sambols & chutneys
    text: Mix into coconut sambol or yoghurt for a green, fragrant twist.
  - title: Drinks & smoothies
    text: Add ½ tsp to buttermilk, warm water or your morning smoothie.

story:
  # Optional: a photo of your own (farm, family, kitchen) in assets/images/, e.g. images/our-family.jpg
  # Leave empty to show the logo panel instead.
  image: ""
  image_alt: ""
  heading: A family love for the humble curry leaf
  paragraphs:   # TODO tell your own story in your own words
    - >-
      In every Sri Lankan kitchen, the curry leaf — karapincha — is the first thing to hit
      the hot oil. Its aroma means a meal is on the way. SPM Organics began with a simple
      wish: to share that everyday goodness, in its purest form, with families in Sri Lanka
      and Sri Lankans and food lovers around the world.
    - >-
      We work in small batches, the way our parents did — picking, washing and drying by hand,
      with no colours, preservatives or fillers. If it isn't pure leaf, it doesn't go in the pouch.
  values:
    - title: Purity
      text: Single-ingredient products, nothing added.
    - title: Honesty
      text: Clear labels, fair prices, real answers.
    - title: Care
      text: Small batches, made by hand, packed with pride.

