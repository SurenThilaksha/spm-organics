name: SPM Organics
tagline: Rooted in purity
motto: Pure by nature. Honest by choice.
intro: >-
  Hand-picked Sri Lankan curry leaves, gently shade-dried and stone-ground into a
  fragrant green powder. Nothing added, nothing taken away — just the leaf.

hero_image: images/hero-curry-leaves.jpg

