faq:
  - q: Is the powder 100% curry leaves?
    a: Yes. The only ingredient is shade-dried curry leaves (Murraya koenigii). No salt, colour, preservatives or fillers.
  - q: How should I store it?
    a: Keep the pouch tightly sealed in a cool, dry place away from sunlight. Use a dry spoon. Best used within 12 months.   # TODO confirm shelf life
  - q: How do I pay?
    a: In Sri Lanka you can pay cash on delivery or by bank transfer. International customers pay by bank transfer for now — card payment is coming soon.   # TODO
  - q: Do you ship outside Sri Lanka?
    a: Yes. Place your order with your full address and we will reply with the shipping cost and delivery time for your country before you pay.
  - q: Do you sell in bulk or wholesale?
    a: Yes — shops, restaurants and distributors are welcome to contact us for bulk pricing.

