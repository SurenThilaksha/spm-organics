{{- /* Illustrated kraft stand-up pouch. Stand-in until real product photos exist.
  Usage: partial "pack.html" (dict "id" "x" "name" "Curry Leaves Powder" "size" "100 g" "color" "#2f6b3a") */ -}}
{{- $id := .id | default "pack" -}}
{{- $c := .color | default "#2f6b3a" -}}
<svg class="pack" viewBox="0 0 300 380" role="img" aria-label="SPM Organics {{ .name }} pouch" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kraft-{{ $id }}" x1="0" x2="1">
      <stop offset="0" stop-color="#c79f6a"/><stop offset=".18" stop-color="#dcbd8c"/>
      <stop offset=".55" stop-color="#d4b07b"/><stop offset="1" stop-color="#b98f5a"/>
    </linearGradient>
    <linearGradient id="powder-{{ $id }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f34"/><stop offset="1" stop-color="#3f5f22"/>
    </linearGradient>
    <linearGradient id="g-{{ $id }}" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b7a37"/><stop offset="1" stop-color="#86c440"/>
    </linearGradient>
    <pattern id="grain-{{ $id }}" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#8a6a3e" opacity=".25"/><circle cx="4" cy="4" r=".5" fill="#fff" opacity=".2"/>
    </pattern>
  </defs>
  <ellipse cx="150" cy="360" rx="112" ry="12" fill="#14231a" opacity=".18"/>
  <path d="M56 44 H244 L252 332 Q252 352 232 354 H68 Q48 352 48 332 Z" fill="url(#kraft-{{ $id }})"/>
  <path d="M56 44 H244 L252 332 Q252 352 232 354 H68 Q48 352 48 332 Z" fill="url(#grain-{{ $id }})"/>
  <rect x="54" y="26" width="192" height="26" rx="3" fill="#b78d58"/>
  <path d="M54 46 H246" stroke="#9c7442" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="72" cy="39" r="4.5" fill="#f6f1e7" opacity=".7"/>
  <path d="M60 64 H240" stroke="#a87f4b" stroke-width="2" opacity=".5"/>
  <rect x="78" y="88" width="144" height="196" rx="10" fill="#fbf8f2"/>
  <rect x="78" y="88" width="144" height="10" rx="5" fill="{{ $c }}"/>
  <g transform="translate(117 104) scale(.33)">{{ partial "leaf-mark.html" (dict "id" $id) }}</g>
  <text x="150" y="178" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="1.6" fill="#14231a">SPM ORGANICS</text>
  <line x1="122" y1="188" x2="178" y2="188" stroke="{{ $c }}" stroke-width="1"/>
  {{- $words := split .name " " -}}
  {{- $l1 := delimit (first (sub (len $words) 1) $words) " " -}}
  {{- $l2 := index $words (sub (len $words) 1) -}}
  <text x="150" y="211" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" fill="{{ $c }}">{{ $l1 }}</text>
  <text x="150" y="232" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="17" fill="{{ $c }}">{{ $l2 }}</text>
  <text x="150" y="256" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="7" letter-spacing=".8" fill="#66736b">100% NATURAL · SRI LANKA</text>
  <text x="150" y="273" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="10" fill="#14231a">{{ .size | default "100 g" }}</text>
  <rect x="112" y="298" width="76" height="36" rx="18" fill="url(#powder-{{ $id }})"/>
  <rect x="112" y="298" width="76" height="36" rx="18" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
  <path d="M120 306 Q132 300 146 304" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M68 70 Q62 200 66 330" stroke="#fff" stroke-opacity=".22" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
