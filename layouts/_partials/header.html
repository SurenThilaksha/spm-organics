<header class="site-header" data-header>
  <div class="container nav">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="SPM Organics home">
      <svg class="brand-mark" viewBox="52 46 104 104" aria-hidden="true">
        <defs><linearGradient id="g-hdr" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1b7a37"/><stop offset="1" stop-color="#86c440"/></linearGradient></defs>
        <circle cx="104" cy="98" r="49" fill="none" stroke="#1b7a37" stroke-opacity=".25" stroke-width="2"/>
        {{ partial "leaf-mark.html" (dict "id" "hdr") }}
      </svg>
      <span class="brand-text">SPM Organics<em>Rooted in purity</em></span>
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="{{ "/products/" | relURL }}">Shop</a>
      <a href="{{ "/about/" | relURL }}">Our Story</a>
      <a href="{{ "/#uses" | relURL }}">How to use</a>
      <a href="{{ "/#faq" | relURL }}">FAQ</a>
      <a href="{{ "/contact/" | relURL }}">Contact</a>
    </nav>
    <div class="nav-tools">
      <div class="currency" role="group" aria-label="Currency">
        <button type="button" data-currency="LKR" aria-pressed="true">LKR</button>
        <button type="button" data-currency="USD" aria-pressed="false">USD</button>
      </div>
      <button class="cart-btn" type="button" data-cart-open aria-label="Open cart">
        {{ partial "icon.html" "cart" }}<span class="cart-count" data-cart-count hidden>0</span>
      </button>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
